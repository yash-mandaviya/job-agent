# Canadian tech companies tuned to Yash's profile: full-stack / software
# engineering, Canada-based search. Fintech, AI, dev tools, healthtech, and
# high-growth SaaS with Canadian HQs or major Canadian engineering offices.
#
# These are a PRIORITY BONUS on top of the JobSpy aggregator (LinkedIn, Indeed,
# Google Jobs). The aggregator handles broad discovery; this list surfaces
# ATS-direct roles straight from company career sites that may not be on
# aggregators.
#
# Every entry below was verified against its ATS API (returns a live job board).
# Slug source: company careers URL.
#   boards.greenhouse.io/<slug>   -> { ats: greenhouse, slug: <slug> }
#   jobs.lever.co/<slug>          -> { ats: lever, slug: <slug> }
#   jobs.ashbyhq.com/<slug>       -> { ats: ashby, slug: <slug> }
# 404s are logged and skipped; safe to leave unsure entries while investigating.
#
# Note: ATS feeds return a company's global postings; the scorer down-ranks
# non-Canadian roles based on your location preferences.

companies:
