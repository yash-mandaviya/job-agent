# Preferences tuned for Yash Mandaviya: full-stack software engineer / developer
# with 2+ years of production experience (FundMore.ai — MEAN stack, AI/RAG),
# Master of Applied Computing (University of Windsor). Based in Canada.
# Targeting full-time individual-contributor software engineering roles.

# Lead with full-stack software engineering; backend and frontend are strong
# secondaries, with AI/RAG application work as a differentiator.
target_functions:
  - Full-Stack Software Development
  - Software Engineering (General)
  - Backend Software Development
  - Frontend Software Development
  - Web Application Development
  - API / Microservices Development
  - AI / RAG Application Engineering
  - Mobile / Cross-Platform Development (Flutter)

# Early-to-mid career IC engineering titles (2+ years of experience).
# Avoid people-management, staff/principal, or roles needing 5+ years.
seniority:
  - Software Engineer
  - Software Developer
  - Full-Stack Developer
  - Software Engineer I / II
  - SDE / SDE I / SDE II (Software Development Engineer)
  - SWE
  - Intermediate / Mid-Level Developer
  - Associate Software Engineer
  - Junior Software Engineer
  - Application Developer

# Industries where his trajectory (fintech, AI, web/mobile) gives credibility.
industries_preferred:
  - Tech / Software / SaaS
  - Fintech
  - AI / ML platforms
  - Healthcare / HealthTech
  - E-commerce / Retail tech
  - Cloud / Developer Tools
  - Mobile / App Development

locations:
  - Canada (any major metro)
  - Remote (Canada)
  # Strong existing footprint in Southwestern/Eastern Ontario — flag slightly higher
  - Greater Toronto Area
  - Ottawa
  - Windsor / Southwestern Ontario

remote_ok: true

# Hard requirement: he does NOT need sponsorship. Keep postings that require
# work authorization; only drop ones that explicitly exclude his status if any.
requires_sponsorship: false

# Avoid these — wrong function or wrong seniority.
exclusions:
  - Non-engineering roles (marketing, sales, product-only, design-only)
  - Engineering Manager / Director / VP / Head-of roles
  - Staff / Principal / Senior Staff engineer roles
  - Roles requiring 5+ years of experience
  - Internships / co-op (targeting full-time)
  - Roles requiring active security clearance
  - Defense contractors

# Differentiators — soft signals to boost score, not hard requirements.
differentiators:
  - 2+ years production full-stack (MEAN / Angular / Node.js / TypeScript)
  - AI / RAG agent development (research-to-production)
  - Strong automated testing + CI/CD (GitHub Actions, high coverage)
  - Microservices delivered on AWS
  - Polyglot — C#/.NET, Java, Python, Dart/Flutter, C/C++
  - Master of Applied Computing (Canada) + Computer Engineering undergrad

# ────────────────────────────────────────────────────────────────────────
# Aggregator search settings — used by JobSpy (LinkedIn/Indeed/Glassdoor/Google)
# ────────────────────────────────────────────────────────────────────────

# Search locations passed to JobSpy. Each location is searched separately, and
# Indeed's country is inferred per location. Canada-only for now.
search_locations:
  - "Canada"

# Glassdoor metros. When populated, Glassdoor searches these metros (it can't parse
# country names) instead of search_locations; each metro runs once per query.
#
# DISABLED ([]) by default: Glassdoor currently blocks JobSpy's location-lookup
# endpoint at the bot-detection layer (returns a "Security" page for every term,
# city or country alike), so it returns nothing regardless of the metro list.
# This is an upstream Glassdoor/JobSpy issue, not a config problem. If a future
# JobSpy release restores Glassdoor, re-enable by listing metros here, e.g.:
#   - "Toronto, Ontario, Canada"
#   - "Vancouver, British Columbia, Canada"
#   - "Ottawa, Ontario, Canada"
glassdoor_metros: []

# Only consider postings newer than this many hours. 24 = last 1 day (fresh signal).
recency_hours: 24

# How many results to request per query per site (per location).
results_per_query: 20

# Search terms — tuned to full-stack software engineering with backend/frontend
# secondaries. Each becomes one query × N sites × N locations.
search_queries:
  # Full-stack — primary
  - "Full Stack Developer"
  - "Full Stack Software Engineer"
  - "Software Engineer"
  - "Software Developer"
  # Backend
  - "Backend Developer"
  - "Backend Software Engineer"
  - "Node.js Developer"
  - "Python Developer"
  - ".NET Developer"
  # Frontend
  - "Frontend Developer"
  - "Angular Developer"
  - "Web Developer"
  # Mid-level IC titles
  - "Software Engineer II"
  - "Software Engineer I"
  - "Intermediate Software Developer"
  - "Application Developer"
  # SDE / Software Development Engineer variants (Amazon-style titles)
  - "Software Development Engineer"
  - "SDE"
  - "SDE I"
  - "SDE II"
  # AI / RAG — leverages his FundMore.ai AI agent work
  - "AI Software Engineer"
  - "Machine Learning Engineer"
